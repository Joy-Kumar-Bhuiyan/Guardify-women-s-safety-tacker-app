name: CI

on:
  pull_request:
  push:
    branches: [production-ready]

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api/v1
      VITE_FIREBASE_API_KEY: ci-public-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: guardify-ci
      VITE_FIREBASE_APP_ID: 1:1:web:ci
      VITE_FIREBASE_MESSAGING_SENDER_ID: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    needs: [formatting, backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: >-
          docker build
          --build-arg VITE_FIREBASE_API_KEY=ci-public-placeholder
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com
          --build-arg VITE_FIREBASE_PROJECT_ID=guardify-ci
          --build-arg VITE_FIREBASE_APP_ID=1:1:web:ci
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=1
          --tag guardify:ci .

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
